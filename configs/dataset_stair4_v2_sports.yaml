# Usage: python main_stair4_v2.py --config configs/dataset_stair4_v2_sports.yaml
# Inherits Amazon2014Sports baseline: batch_size=1024, lr=1e-3, weight_decay=0.1, gamma=0.2
base_config: Amazon2014Sports_550_MMRec.yaml

# STAIR4-v2.1 (BCCR) configuration on Amazon Sports
auxiliary_kernel: hybrid
rotation_mode: identity
smoother_mode: baseline
eta: 0.25
kappa: 0.5
contrastive_temperature: 0.2
pocl_weight_target: 0.0001
warmup_epochs: 10
ramp_epochs: 20
xi: 0.0
aux_lr_ratio: 0.1
aux_weight_decay: 0.0
knn_block_size: 256
query_chunk_size: 256
ablation_id: C2
