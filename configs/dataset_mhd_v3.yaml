# Usage: python main_stair_mhd_v3.py --config configs/dataset_mhd_v3.yaml
# Inheritance is resolved by this entrypoint relative to this file.
# For another dataset, create a new config pointing to its own baseline YAML;
# changing --dataset alone would retain Baby's gamma and weight_decay.
base_config: Amazon2014Baby_550_MMRec.yaml

# Explicit pilot overrides from docs/giai_doan_4/v3.md.
# Baseline dimension/layers, lr, decay, optimizer, epochs, batch, gamma,
# sampling/ranking and which4best are inherited without replacement.
knn_block_size: 256
gate_hidden_dim: 16
gate_floor: 0.05
gate_prior: 0.8
behavior_support_s: 10.0
behavior_eta: 1.0
modality_weights: [0.8333333333333334, 0.16666666666666666]
learn_modality_weights: false
bsc_mix_target: 0.25
cl_weight_target: 0.001
cl_temperature: 0.2
budget_weight_target: 0.0001
warmup_epochs: 10
ramp_epochs: 20
aux_lr_ratio: 0.1
aux_weight_decay: 0.0
gate_mode: soft
gumbel_temperature: 0.5
graph_weight_refresh: every_step
projector: shared_linear_identity_init
